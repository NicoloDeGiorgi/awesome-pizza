<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{fragments/fragments :: head}"></head>

<body class="bg-dark text-white">

	<header th:insert="~{fragments/navbar :: navbar('ordini')}"></header>

	<main class="container py-5">
		<div class="row justify-content-center">
			<div class="col-lg-6">
				<div class="card text-white bg-dark border-0 shadow-lg rounded-4">
					<div class="card-body p-4">

						<h2 class="fw-bold text-center mb-4">➕ Nuovo Ordine</h2>

						<hr class="border-secondary">

						<!-- th:action - URL del form, th:object - lega il form all'oggetto ordine -->
						<form th:action="@{/ordini/create}" th:object="${ordine}" method="post">

							<div class="mb-3">
								<label class="form-label">Seleziona Pizze</label>
								<select class="form-select bg-secondary text-white border-0" th:field="*{pizze}"
									multiple> <!-- permette selezione di più pizze -->
									<!-- th:each - genera un'option per ogni pizza disponibile -->
									<option th:each="pizza : ${pizzeDisponibili}" th:value="${pizza.id}"
										th:text="${pizza.nome} + ' - ' + ${pizza.prezzo} + '€'">
									</option>
								</select>
							</div>

							<div class="d-flex justify-content-center gap-3 mt-4">
								<a th:href="@{/ordini}" class="btn btn-outline-light rounded-pill px-4">
									← Annulla
								</a>
								<button type="submit" class="btn btn-primary rounded-pill px-4">
									💾 Ordina
								</button>
							</div>

						</form>

					</div>
				</div>
			</div>
		</div>
	</main>

	<footer th:replace="~{fragments/fragments :: footer}"></footer>
	<th:block th:replace="~{fragments/fragments :: scripts}"></th:block>
</body>

</html>
