<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{fragments/fragments :: head}"></head>

<body class="bg-dark text-white">

    <header th:insert="~{fragments/navbar :: navbar('pizze')}"></header>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card text-white bg-dark border-0 shadow-lg rounded-4">
                    <div class="card-body p-4">

                        <h2 class="fw-bold text-center mb-4">➕ Nuova Pizza</h2>

                        <hr class="border-secondary">

                        <!-- th:action - URL del form, th:object - lega il form all'oggetto pizza -->
                        <form th:action="@{/pizze/create}" th:object="${pizza}" method="post">

                            <!-- th:field - lega il campo all'attributo dell'oggetto -->
                            <!-- th:classappend - aggiunge is-invalid se ci sono errori di validazione -->
                            <div class="mb-3">
                                <label class="form-label">Nome</label>
                                <input type="text" class="form-control bg-secondary text-white border-0"
                                    th:field="*{nome}"
                                    th:classappend="${#fields.hasErrors('nome')} ? ' is-invalid' : ''"
                                    placeholder="Es. Margherita" />
                                <div class="invalid-feedback" th:errors="*{nome}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Descrizione</label>
                                <textarea class="form-control bg-secondary text-white border-0"
                                    th:field="*{descrizione}"
                                    th:classappend="${#fields.hasErrors('descrizione')} ? ' is-invalid' : ''"
                                    rows="3" placeholder="Es. Pomodoro e mozzarella"></textarea>
                                <div class="invalid-feedback" th:errors="*{descrizione}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Prezzo (€)</label>
                                <input type="number" step="0.01"
                                    class="form-control bg-secondary text-white border-0"
                                    th:field="*{prezzo}"
                                    th:classappend="${#fields.hasErrors('prezzo')} ? ' is-invalid' : ''"
                                    placeholder="Es. 7.50" />
                                <div class="invalid-feedback" th:errors="*{prezzo}"></div>
                            </div>

                            <div class="d-flex justify-content-center gap-3 mt-4">
                                <a th:href="@{/pizze}" class="btn btn-outline-light rounded-pill px-4">
                                    ← Annulla
                                </a>
                                <button type="submit" class="btn btn-primary rounded-pill px-4">
                                    💾 Salva
                                </button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/fragments :: footer}"></footer>
    <th:block th:replace="~{fragments/fragments :: scripts}"></th:block>
</body>
</html>
