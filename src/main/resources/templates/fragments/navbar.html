<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <header>
        <nav th:fragment="navbar(route)" class="navbar navbar-expand-md navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" th:href="@{/}">Awesome Pizza</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarContent">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav me-auto mb-2 mb-md-0">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/pizze}"
                                th:classappend="${route == 'pizze' ? ' active' : ''}">PIZZE</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/ordini}"
                                th:classappend="${route == 'ordini' ? ' active' : ''}">ORDINI</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
</body>
</html>
